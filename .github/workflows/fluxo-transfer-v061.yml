name: Fluxo transfer v0.6.1

on:
  push:
    branches: [fluxo-transfer-v061]

permissions:
  contents: write

jobs:
  transfer:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluxo-transfer-v061
          fetch-depth: 1

      - name: Baixar APK assinado
        run: |
          mkdir -p transfer
          curl --fail --location --silent --show-error \
            -o transfer/Fluxo-v0.6.1.apk \
            'https://tmpfiles.org/dl/wQwbrj6BWE8J/fluxo-v0.6.1.apk'
          echo '43c51a555d47332f653c380a6b480cebf2c03391bad8611593cac4a769fd2d1e  transfer/Fluxo-v0.6.1.apk' | sha256sum -c -
          ls -lh transfer/Fluxo-v0.6.1.apk

      - name: Guardar APK temporariamente na branch
        run: |
          git config user.name 'Fluxo Transfer CI'
          git config user.email 'actions@github.com'
          git add transfer/Fluxo-v0.6.1.apk
          git commit -m 'transfer: Fluxo v0.6.1 signed [skip ci]'
          git push origin HEAD:fluxo-transfer-v061
